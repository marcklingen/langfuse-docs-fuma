              - text: Short-lived applications
            - img
          - paragraph: For applications that start, execute something, and shut down quickly (short-lived applications), there's a risk that the application terminates while there are still unsent traces in the queue.
          - paragraph:
            - text: To avoid losing data, short-lived applications
            - strong:
              - text: must explicitly call
              - link:
                - /url: /docs/observability/features/queuing-batching#manual-flushing
                - code: flush()
              - text: before exiting
            - text: . This forces the exporter to send all buffered traces immediately, so nothing is lost when the process terminates.
