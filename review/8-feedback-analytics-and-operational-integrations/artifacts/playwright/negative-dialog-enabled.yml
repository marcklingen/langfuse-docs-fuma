            - generic:
              - generic:
                - paragraph:
                  - text: This data model is live on Langfuse Cloud. For OSS deployments, this will be Langfuse V4. See the
                  - link:
                    - /url: /changelog/2026-03-10-simplify-for-scale
                    - text: changelog post
                  - text: for more details.
          - paragraph:
            - text: To improve query performance at scale, Langfuse introduces an
            - strong: observation-centric data model
            - text: . In this model, context attributes (
            - code: user_id
            - text: ","
            - code: session_id
            - text: ","
            - code: metadata
            - text: ","
            - code: tags
            - text: ) that previously lived only on the trace are propagated to every observation. This eliminates expensive joins between trace and observation tables, enabling single-table queries.
