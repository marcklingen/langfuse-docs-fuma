          - heading [level=2]:
            - link:
              - /url: "#how-langfuse-captures-data"
              - text: How Langfuse Captures Data
            - img
          - paragraph: Now that you understand the data model, let's explore how Langfuse actually captures and processes your traces.
          - heading [level=3]:
            - link:
              - /url: "#built-on-opentelemetry"
              - text: Built on OpenTelemetry
            - img
          - paragraph:
            - text: Langfuse is built on
            - link:
              - /url: https://opentelemetry.io/
              - text: OpenTelemetry
            - text: ", an open standard for collecting telemetry data from applications."
          - paragraph: This means you're not locked into using only Langfuse-specific SDKs. You can also send your traces to multiple destinations at once, like Langfuse for LLM observability and Datadog for infrastructure monitoring.
          - paragraph:
            - text: See the
            - link:
              - /url: /integrations/native/opentelemetry
              - text: OpenTelemetry integration guide
            - text: for detailed documentation on integrating OpenTelemetry with Langfuse.
          - heading [level=4]:
            - link:
              - /url: "#instrumentation"
              - text: Instrumentation
            - img
          - paragraph: Instrumentation is the process of adding code to record its behavior. Once this recording is turned on, Langfuse (through OpenTelemetry) can automatically capture these events and structure them into traces and observations.
          - paragraph:
            - text: The
            - link:
              - /url: /docs/observability/get-started
              - text: Get Started guide
            - text: walks you through the process of instrumenting a function in your application.
          - heading [level=3]:
            - link:
              - /url: "#background-processing"
              - text: Background Processing
            - img
          - paragraph: In order to avoid slowing down your application, Langfuse doesn't send traces synchronously the moment they're created. Instead, Langfuse batches traces locally and sends them in the background, keeping your application fast and responsive.
